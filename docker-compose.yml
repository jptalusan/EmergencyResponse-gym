services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ERuser
      POSTGRES_PASSWORD: ERpass
      POSTGRES_DB: ERdb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    mem_limit: 16g
    cpus: 4
    shm_size: "4gb"
    env_file: .env
    depends_on: [postgres]
    ports: ["8000:8000"]
    volumes:
      - ./storage:/data/storage
      - ./configs:/app/configs
      - ./data:/app/data:ro
      - ./output:/app/output:ro
      - ./output:/app/outputs
    environment:
      STORAGE_ROOT: /data/storage
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker
    mem_limit: 16g
    cpus: 4
    shm_size: "4gb"
    env_file: .env
    depends_on: [postgres]
    volumes:
      - ./storage:/data/storage
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./output:/app/output
      - ./output:/app/outputs
    environment:
      STORAGE_ROOT: /data/storage
    command: uv run python -m worker.main

volumes:
  pgdata:
